<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ติดตามงาน กสฟ. ปี 2569</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', 'Segoe UI', sans-serif;
      background: #f9fafb;
      color: #1a202c;
      font-size: 14px;
    }

    header {
      background: linear-gradient(135deg, #374151, #f97316);
      color: white;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header .logo { font-size: 32px; }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    header p  { font-size: 13px; opacity: 0.8; margin-top: 2px; }
    header .contact { margin-left: auto; font-size: 11px; opacity: 0.75; text-align: right; line-height: 1.6; }

    .toolbar {
      padding: 12px 32px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar input {
      padding: 7px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 13px;
      width: 280px;
      outline: none;
    }
    .toolbar input:focus { border-color: #f97316; }
    .toolbar .status-badge {
      margin-left: auto;
      font-size: 12px;
      color: #64748b;
    }
    .status-badge span {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* Filter buttons */
    .filter-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid #cbd5e0;
      background: white;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      color: #4b5563;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: #94a3b8; background: #f8fafc; }
    .filter-btn.f-ongoing  { color: #854d0e; border-color: #fde68a; }
    .filter-btn.f-done     { color: #166534; border-color: #bbf7d0; }
    .filter-btn.f-cancelled { color: #991b1b; border-color: #fecaca; }
    .filter-btn.active {
      background: #374151;
      color: white;
      border-color: #374151;
    }
    .filter-btn.active.f-ongoing  { background: #eab308; border-color: #eab308; color: white; }
    .filter-btn.active.f-done     { background: #16a34a; border-color: #16a34a; color: white; }
    .filter-btn.active.f-cancelled { background: #ef4444; border-color: #ef4444; color: white; }

    /* Status dot badge */
    .status-dot-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }
    .status-dot-wrap.ongoing  { color: #854d0e; }
    .status-dot-wrap.done     { color: #166534; }
    .status-dot-wrap.cancelled { color: #991b1b; }
    .status-dot.ongoing   { background: #eab308; box-shadow: 0 0 0 3px #fef9c3; }
    .status-dot.done      { background: #22c55e; box-shadow: 0 0 0 3px #dcfce7; }
    .status-dot.cancelled { background: #ef4444; box-shadow: 0 0 0 3px #fee2e2; }

    /* Row left stripe by status */
    tbody tr[data-status="ongoing"]   { box-shadow: inset 4px 0 0 #eab308; }
    tbody tr[data-status="done"]      { box-shadow: inset 4px 0 0 #22c55e; }
    tbody tr[data-status="cancelled"] { box-shadow: inset 4px 0 0 #ef4444; }

    .table-wrap {
      padding: 20px 32px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    thead th {
      background: #374151;
      color: white;
      padding: 12px 14px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
      font-size: 13px;
    }
    thead th:first-child { width: 48px; text-align: center; border-radius: 10px 0 0 0; }
    thead th:last-child  { width: 100px; text-align: center; border-radius: 0 10px 0 0; }

    tbody tr { border-bottom: 1px solid #e9eef5; transition: background 0.15s; }
    tbody tr:hover { background: #fff7ed; }
    tbody tr:last-child { border-bottom: none; }

    td { padding: 10px 14px; vertical-align: top; }
    td:first-child { text-align: center; color: #64748b; font-weight: 500; }
    td:last-child  { text-align: center; }

    .col-item    { min-width: 200px; max-width: 260px; font-weight: 500; }
    .col-plan    { min-width: 240px; max-width: 300px; white-space: pre-line; color: #374151; }
    .col-step    { min-width: 220px; max-width: 280px; white-space: pre-line; color: #374151; }
    .col-date    { white-space: nowrap; color: #64748b; font-size: 12px; min-width: 90px; }
    .col-owner   { white-space: nowrap; color: #4b5563; font-size: 13px; min-width: 100px; }
    .col-status  { white-space: nowrap; min-width: 110px; text-align: center; }

    .empty-cell { color: #cbd5e0; font-style: italic; font-size: 12px; }

    .btn-update {
      background: #f97316;
      color: white;
      border: none;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-update:hover { background: #ea580c; }

    /* Modal */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.active { display: flex; }

    .modal {
      background: white;
      border-radius: 12px;
      width: 560px;
      max-width: 95vw;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; color: #374151; }
    .modal .modal-item { font-size: 13px; color: #64748b; margin-bottom: 18px; }
    .modal label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
    .modal textarea {
      width: 100%;
      border: 1px solid #cbd5e0;
      border-radius: 7px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      min-height: 90px;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal textarea:focus { border-color: #f97316; }
    .modal .field-group { margin-bottom: 16px; }

    .modal .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 22px;
    }
    .modal-footer-right {
      display: flex;
      gap: 10px;
    }

    /* Segmented status selector in modal footer */
    .seg-group {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #cbd5e0;
      flex: 1;
      max-width: 320px;
    }
    .seg-btn {
      flex: 1;
      padding: 7px 4px;
      border: none;
      background: #f8fafc;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #64748b;
      transition: all 0.15s;
      border-right: 1px solid #cbd5e0;
      white-space: nowrap;
    }
    .seg-btn:last-child { border-right: none; }
    .seg-btn:hover { background: #f1f5f9; color: #374151; }
    .seg-btn.active-ongoing   { background: #eab308; color: white; }
    .seg-btn.active-done      { background: #16a34a; color: white; }
    .seg-btn.active-cancelled { background: #ef4444; color: white; }

    .btn-cancel {
      padding: 8px 20px;
      border: 1px solid #cbd5e0;
      border-radius: 7px;
      background: white;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }
    .btn-save {
      padding: 8px 22px;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-save:hover { background: #ea580c; }

    .toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: #16a34a;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .loading {
      text-align: center;
      padding: 48px;
      color: #64748b;
    }
    .spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid #e2e8f0;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Card list (hidden by default, shown on tablet/mobile) ---- */
    .card-list { display: none; }

    /* ---- Card styles (shared: tablet + mobile) ---- */
    .card {
      background: white;
      border-radius: 10px;
      margin-bottom: 12px;
      padding: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      border-left: 4px solid #f97316;
    }
    .card.status-ongoing   { border-left-color: #eab308; }
    .card.status-done      { border-left-color: #22c55e; }
    .card.status-cancelled { border-left-color: #ef4444; }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .card-num {
      background: #374151;
      color: white;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
      line-height: 1.6;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #1a202c;
      line-height: 1.4;
      flex: 1;
    }
    .card-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      font-size: 12px;
      padding-left: 2px;
      align-items: center;
    }
    .card-owner { color: #4b5563; font-weight: 500; }
    .card-date  { color: #94a3b8; }
    .card-section { margin-bottom: 8px; }
    .card-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      text-transform: uppercase;
    }
    .card-text {
      font-size: 13px;
      color: #374151;
      white-space: pre-line;
      line-height: 1.5;
    }
    .card-empty { font-size: 12px; color: #cbd5e0; font-style: italic; }
    .card-footer {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-update-card {
      background: #f97316;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
    }
    .btn-update-card:hover { background: #ea580c; }

    /* ---- Tablet (768px – 1199px) ---- */
    @media (min-width: 768px) and (max-width: 1199px) {
      header .contact { display: none; }

      .toolbar { padding: 10px 20px; }
      .toolbar input { width: 220px; }

      .table-wrap { padding: 16px 20px; }
      #mainTable { display: none !important; }

      .card-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .card { margin-bottom: 0; }
    }

    /* ---- Mobile (≤767px) ---- */
    @media (max-width: 767px) {
      header {
        padding: 12px 16px;
        flex-wrap: wrap;
        gap: 8px;
      }
      header .logo { font-size: 26px; }
      header h1 { font-size: 16px; }
      header p  { font-size: 12px; }
      header .contact { display: none; }

      .toolbar {
        padding: 10px 16px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .toolbar input {
        width: 100%;
        font-size: 15px;
        padding: 9px 14px;
      }
      .toolbar .status-badge { margin-left: 0; }
      .filter-btns { width: 100%; }
      .filter-btn { font-size: 11px; padding: 5px 10px; }

      .table-wrap {
        padding: 12px 12px;
        overflow-x: visible;
      }
      #mainTable { display: none !important; }
      .card-list { display: block; }

      .btn-update-card { font-size: 14px; padding: 9px 22px; min-height: 44px; }
      .btn-update-card:active { background: #ea580c; }

      /* Modal → bottom sheet */
      .overlay { align-items: flex-end; }
      .modal {
        width: 100%;
        max-width: 100%;
        border-radius: 16px 16px 0 0;
        padding: 20px 16px 32px;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal textarea { font-size: 15px; min-height: 80px; }
      .btn-cancel, .btn-save { min-height: 44px; font-size: 15px; }
      .btn-save { flex: 1; }
      .modal .modal-footer { flex-wrap: wrap; gap: 8px; }

      .toast { bottom: 16px; right: 12px; left: 12px; text-align: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡</div>
  <div>
    <h1>ติดตามงาน กสฟ. ปี 2569</h1>
    <p>กองสถานีไฟฟ้า — ระบบติดตามสถานะงาน</p>
  </div>
  <div class="contact">ติดต่อสอบถามข้อมูลเพิ่มเติม<br>คุณอรรถพล Tel.702-4886</div>
</header>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="🔍  ค้นหารายการงาน..." oninput="filterTable()" />
  <div class="filter-btns">
    <button class="filter-btn active" id="fbAll"       onclick="setStatusFilter('')">ทั้งหมด</button>
    <button class="filter-btn f-ongoing" id="fbOngoing" onclick="setStatusFilter('ongoing')">● กำลังดำเนินการ</button>
    <button class="filter-btn f-done"    id="fbDone"    onclick="setStatusFilter('done')">● สำเร็จ</button>
    <button class="filter-btn f-cancelled" id="fbCancelled" onclick="setStatusFilter('cancelled')">● ยกเลิก</button>
  </div>
  <div class="status-badge"><span></span>เชื่อมต่อ database</div>
</div>

<div class="table-wrap">
  <div class="loading" id="loadingDiv">
    <div class="spinner"></div><br>กำลังโหลดข้อมูลจาก Google Sheets...
  </div>
  <table id="mainTable" style="display:none">
    <thead>
      <tr>
        <th>ลำดับ</th>
        <th>รายการ</th>
        <th>แผนการดำเนินงาน</th>
        <th>ขั้นตอนปัจจุบัน</th>
        <th>อัพเดทเมื่อ</th>
        <th>ผู้รับผิดชอบ</th>
        <th>สถานะ</th>
        <th>แก้ไข</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="card-list" id="cardList"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modalBox">
    <h2>แก้ไขรายการงาน</h2>
    <div class="modal-item" id="modalItemName"></div>
    <div class="field-group">
      <label>แผนการดำเนินงาน</label>
      <textarea id="inputPlan" rows="4"></textarea>
    </div>
    <div class="field-group">
      <label>ขั้นตอนปัจจุบัน</label>
      <textarea id="inputStep" rows="4"></textarea>
    </div>
    <div class="modal-footer">
      <div class="seg-group">
        <button class="seg-btn" id="segOngoing"   onclick="selectStatus('ongoing')">กำลังดำเนินการ</button>
        <button class="seg-btn" id="segDone"      onclick="selectStatus('done')">สำเร็จ</button>
        <button class="seg-btn" id="segCancelled" onclick="selectStatus('cancelled')">ยกเลิก</button>
      </div>
      <div class="modal-footer-right">
        <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
        <button class="btn-save" onclick="saveRow()">บันทึก</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let INDEX_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwiyhHSiIe6p_mB-HRsCFRiwwYH_a9uzDgYzPxtX6E9I8XmydgkebpkUXDSjX4PuLsn/exec';
  const API_TOKEN = 'mea2569';


  const STATUS_LABEL = { ongoing: 'กำลังดำเนินการ', done: 'สำเร็จ', cancelled: 'ยกเลิก' };

  let tableData = [];
  let editingRow = null;
  let currentStatusFilter = '';
  let currentEditStatus = 'ongoing';

  /* ---------- Load data ---------- */
  async function loadData() {
    try {
      const url = `${INDEX_SCRIPT_URL}?action=read&token=${API_TOKEN}`;
      const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (json.status !== 'ok') throw new Error(json.msg || 'ไม่สามารถโหลดข้อมูลได้');
      tableData = json.rows.map((r, i) => ({ ...r, _idx: i }));
    } catch (err) {
      console.error(err);
      document.getElementById('loadingDiv').innerHTML =
        `<div style="color:#ef4444; font-weight:bold;">⚠️ ข้อผิดพลาด: ${err.message}<br>โปรดตรวจสอบการเชื่อมต่อ หรือ Token</div>`;
      return;
    }
    renderTable(getFiltered());
    document.getElementById('loadingDiv').style.display = 'none';
    document.getElementById('mainTable').style.display  = '';
    document.getElementById('cardList').style.display   = '';
  }

  function parseCSV(text) {
    const rows = []; let row = []; let cell = ''; let inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
        else if (c === '"') inQ = false;
        else cell += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ',') { row.push(cell); cell = ''; }
        else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
        else if (c !== '\r') cell += c;
      }
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  /* ---------- Render ---------- */
  function statusBadge(status) {
    const s = status || 'ongoing';
    return `<span class="status-dot-wrap ${s}"><span class="status-dot ${s}"></span>${STATUS_LABEL[s]}</span>`;
  }

  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = data.map((r, idx) => `
      <tr data-idx="${idx}" data-status="${r.status || 'ongoing'}">
        <td>${r.no}</td>
        <td class="col-item">${esc(r.item)}</td>
        <td class="col-plan">${r.plan ? esc(r.plan) : '<span class="empty-cell">—</span>'}</td>
        <td class="col-step">${r.step ? esc(r.step) : '<span class="empty-cell">—</span>'}</td>
        <td class="col-date">${r.date || ''}</td>
        <td class="col-owner">${esc(r.owner)}</td>
        <td class="col-status">${statusBadge(r.status)}</td>
        <td><button class="btn-update" onclick="openModal(${r._idx})">แก้ไข</button></td>
      </tr>`).join('');
    renderCards(data);
  }

  function renderCards(data) {
    const list = document.getElementById('cardList');
    list.innerHTML = data.map(r => `
      <div class="card status-${r.status || 'ongoing'}">
        <div class="card-header">
          <span class="card-num">${r.no}</span>
          <span class="card-title">${esc(r.item)}</span>
        </div>
        <div class="card-meta">
          ${r.owner ? `<span class="card-owner">👤 ${esc(r.owner)}</span>` : ''}
          ${r.date  ? `<span class="card-date">🕐 ${r.date}</span>` : ''}
          ${statusBadge(r.status)}
        </div>
        ${r.plan ? `<div class="card-section">
          <div class="card-label">แผนการดำเนินงาน</div>
          <div class="card-text">${esc(r.plan)}</div>
        </div>` : ''}
        ${r.step ? `<div class="card-section">
          <div class="card-label">ขั้นตอนปัจจุบัน</div>
          <div class="card-text">${esc(r.step)}</div>
        </div>` : ''}
        <div class="card-footer">
          <button class="btn-update-card" onclick="openModal(${r._idx})">แก้ไข</button>
        </div>
      </div>`).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ---------- Filter ---------- */
  function getFiltered() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    return tableData.filter(r => {
      const matchSearch = !q || (
        r.item.toLowerCase().includes(q) ||
        r.plan.toLowerCase().includes(q) ||
        r.step.toLowerCase().includes(q) ||
        r.owner.toLowerCase().includes(q)
      );
      const matchStatus = !currentStatusFilter || (r.status || 'ongoing') === currentStatusFilter;
      return matchSearch && matchStatus;
    });
  }

  function filterTable() {
    renderTable(getFiltered());
  }

  function setStatusFilter(status) {
    currentStatusFilter = status;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    const map = { '': 'fbAll', 'ongoing': 'fbOngoing', 'done': 'fbDone', 'cancelled': 'fbCancelled' };
    document.getElementById(map[status]).classList.add('active');
    filterTable();
  }

  /* ---------- Modal ---------- */
  function selectStatus(s) {
    currentEditStatus = s;
    ['ongoing','done','cancelled'].forEach(v => {
      const btn = document.getElementById('seg' + v.charAt(0).toUpperCase() + v.slice(1));
      btn.className = 'seg-btn' + (v === s ? ' active-' + v : '');
    });
  }

  function openModal(idx) {
    editingRow = idx;
    const r = tableData[idx];
    document.getElementById('modalItemName').textContent = `${r.no}. ${r.item}`;
    document.getElementById('inputPlan').value = r.plan;
    document.getElementById('inputStep').value = r.step;
    selectStatus(r.status || 'ongoing');
    document.getElementById('overlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('active');
    editingRow = null;
  }

  async function saveRow() {
    if (editingRow === null) return;
    const now = new Date();
    const dateStr = `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getFullYear()+543}`;

    const newPlan   = document.getElementById('inputPlan').value;
    const newStep   = document.getElementById('inputStep').value;
    const newStatus = currentEditStatus;
    const sheetRow  = tableData[editingRow]._row;

    tableData[editingRow].plan   = newPlan;
    tableData[editingRow].step   = newStep;
    tableData[editingRow].date   = dateStr;
    tableData[editingRow].status = newStatus;

    filterTable();
    closeModal();
    showToast('บันทึกข้อมูลเรียบร้อย — ' + dateStr);

    if (!INDEX_SCRIPT_URL) return;
    try {
      const url = `${INDEX_SCRIPT_URL}?action=update&row=${sheetRow}`
        + `&plan=${encodeURIComponent(newPlan)}`
        + `&step=${encodeURIComponent(newStep)}`
        + `&date=${encodeURIComponent(dateStr)}`
        + `&status=${encodeURIComponent(newStatus)}`
        + `&token=${API_TOKEN}`;
      const res = await fetch(url);
      const json = await res.json();
      if (json.status !== 'ok') showToast('⚠️ บันทึกใน Sheets ไม่สำเร็จ: ' + (json.msg || ''));
    } catch (err) {
      showToast('⚠️ เชื่อมต่อ Apps Script ไม่ได้');
    }
  }

  /* ---------- Toast ---------- */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  loadData();
</script>
</body>
</html>
